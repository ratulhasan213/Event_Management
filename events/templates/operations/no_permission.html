<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied</title>

  
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-red-900 via-rose-900 to-black">

    <div class="bg-red-950/80 backdrop-blur-md rounded-2xl shadow-2xl px-10 py-12 text-center max-w-md w-full border border-red-700">

        <div class="text-6xl mb-4 animate-pulse">&#x1F6AB;</div>

        <h1 class="text-3xl font-extrabold text-red-400 mb-3">
            Access Denied
        </h1>

        <p class="text-red-200 text-lg mb-4">
            You do not have permission to access this action.
        </p>

        <div class="h-px bg-gradient-to-r from-transparent via-red-600 to-transparent my-6"></div>

    </div>

</body>
</html>
