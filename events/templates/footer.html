{% load static %}
<footer class="bg-gray-800 text-white py-6">
  <div class="container mx-auto px-4">

    <!-- Footer sections side by side -->
    <div class="flex  justify-between gap-6">

      <!-- Quick Links -->
      <div class="w-full md:w-1/3">
        <h4 class="text-lg font-semibold mb-2">Quick Links</h4>
        <ul class="text-gray-400 space-y-1 text-sm">
          <li><a href="#" class="hover:text-white">Home</a></li>
          <li><a href="#" class="hover:text-white">Features</a></li>
          <li><a href="#" class="hover:text-white">Pricing</a></li>
          <li><a href="#" class="hover:text-white">Contact</a></li>
        </ul>
      </div>

      <!-- Connect -->
      <div class="w-full md:w-1/3">
        <h4 class="text-lg font-semibold mb-2">Connect</h4>
        <ul class="text-gray-400 space-y-1 text-sm">
          <li><a href="#" class="hover:text-white">Twitter</a></li>
          <li><a href="#" class="hover:text-white">LinkedIn</a></li>
          <li><a href="#" class="hover:text-white">Facebook</a></li>
        </ul>
      </div>

      <!-- Newsletter -->
      <div class="w-full md:w-1/3">
        <h4 class="text-lg font-semibold mb-2">Newsletter</h4>
        <form class="flex gap-1">
          <input
            type="email"
            placeholder="Email"
            class="w-full px-2 py-1 text-gray-700 bg-gray-200 rounded-l-md text-sm focus:outline-none"
            required
          />
          <button
            type="submit"
            class="bg-blue-500 text-white px-3 py-1 rounded-r-md hover:bg-blue-600 transition duration-300 text-sm"
          >
            Subscribe
          </button>
        </form>
      </div>

    </div>

    <!-- Copyright -->
    <div class="border-t border-gray-700 mt-6 pt-4 text-xs text-center text-gray-400">
      &copy; 2025 All rights reserved.
    </div>
  </div>
</footer>
