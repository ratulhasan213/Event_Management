{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Superuser Profile</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-900 via-slate-900 to-black">

    <div class="bg-gray-800/90 backdrop-blur-md rounded-2xl shadow-2xl px-10 py-12 text-center max-w-md w-full">
        
        <div class="text-5xl mb-4">&#128081;</div>

        <h1 class="text-3xl font-bold text-yellow-400 mb-2">
            Welcome, Superuser
        </h1>

        <p class="text-gray-300 text-lg">
            Hello
            <span class="font-semibold text-sky-400">
                {{ user.username }}
            </span>
        </p>

        <div class="mt-6 h-px bg-gradient-to-r from-transparent via-gray-600 to-transparent"></div>

        <p class="mt-4 text-sm text-gray-400">
            You have full administrative privileges.
        </p>
    </div>

</body>
</html>
